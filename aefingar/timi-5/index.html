<script>
(function(){'use strict';

const VERSION=1,KEY='ggj-lota16-timi05-aefing-v1';
const GROUPS=['Jafnvægi í jöfnu','Röð og neikvæð svör','Margföldun og deiling','Tugabrot og brotastrik','Stuðlar minni og stærri en einn'];
const fmt=n=>String(Math.round(n*1e10)/1e10).replace('.',',').replace(/-/g,'−');
const v=s=>'<i>'+s+'</i>';
const pow=s=>v(s)+'<sup>2</sup>';
function poly(terms){let out='';for(const [n,s] of terms){if(!n)continue;let a=Math.abs(n),body=(a===1&&s?'':fmt(a))+s;out+=(out?(n<0?' − ':' + '):(n<0?'−':''))+body;}return out||'0';}
const PX=(a,b,c=0)=>poly([[a,pow('x')],[b,v('x')],[c,'']]);
const LX=(a,b)=>poly([[a,v('x')],[b,'']]);
const frac=(a,b)=>'<span class="fraction"><span>'+a+'</span><span>'+b+'</span></span>';
const eqs=(start,...lines)=>'<div class="math-steps"><div>'+start+'</div>'+lines.map(s=>'<div>= '+s+'</div>').join('')+'</div>';
function build(seed=0){
 const p=seed%2===0?
 {add:[9,23],subtract:[8,17],reverse:[12,19],negative:[-22,8],multiply:[7,-56],divide:[4,-6],decimal:[2.4,14.4],reverseFraction:[7,0.3],hundred:[100,0.7],small:[0.3,45],overOne:[1.2,420],precise:[0.375,2250],tiny:[0.0015,72]}:
 {add:[8,27],subtract:[12,21],reverse:[15,24],negative:[-25,9],multiply:[6,-66],divide:[5,-7],decimal:[1.5,10.5],reverseFraction:[9,0.4],hundred:[100,0.8],small:[0.4,72],overOne:[1.25,600],precise:[0.225,1800],tiny:[0.0024,144]};
 const qs=[];
 const mc=(group,title,intro,board,options,hints,explain,wrong,variable='x')=>{
  const offset=(qs.length+seed)%options.length;
  const rotated=options.map((html,i)=>({html,correct:i===0}));
  for(let k=0;k<offset;k++)rotated.push(rotated.shift());
  qs.push({group,title,intro,board,type:'choice',variable,options:rotated.map(o=>o.html),correct:rotated.findIndex(o=>o.correct),hints,explain,wrong});
 };
 const num=(group,title,intro,board,answer,variable,hints,explain)=>
  qs.push({group,title,intro,board,type:'number',variable,answer:Math.round(answer*1e10)/1e10,label:variable+' =',unit:'',hints,explain});
 const L=(a,b,letter='x')=>poly([[a,v(letter)],[b,'']]);
 const steps=(...lines)=>'<div class="math-steps">'+lines.map(s=>'<div>'+s+'</div>').join('')+'</div>';
 const solution=(variable,answer)=>v(variable)+' = '+fmt(answer);
 const par=n=>n<0?'('+fmt(n)+')':fmt(n);
 const verify=(left,right)=>'<p>Athugun: <span class="math">'+left+' = '+fmt(right)+'</span>.</p>';
 let a,b,board,answer;

 [a,b]=p.add;board=L(1,a)+' = '+fmt(b);answer=b-a;
 mc(0,'Gerðu það sama báðum megin','Dragðu '+fmt(a)+' frá báðum hliðum. Hvaða jafna fæst?',board,
  [v('x')+' = '+fmt(b)+' − '+fmt(a),v('x')+' = '+fmt(b)+' + '+fmt(a),v('x')+' = '+frac(b,a),v('x')+' = '+fmt(a)+' − '+fmt(b)],
  ['Einangraðu x með því að draga '+fmt(a)+' frá báðum hliðum.',
   'Draga þarf sömu tölu frá báðum hliðum jafnaðarmerkisins. Þá helst jafnan í jafnvægi.'],
  steps(board,L(1,a)+' − '+fmt(a)+' = '+fmt(b)+' − '+fmt(a),v('x')+' = '+fmt(b)+' − '+fmt(a)),
  'Framkvæmdu sömu aðgerð báðum megin jafnaðarmerkisins. Þegar '+fmt(a)+' er dregið frá verður hægri hliðin '+fmt(b)+' − '+fmt(a)+'.');
 num(0,'Finndu gildið á x','Ljúktu lausn sömu jöfnu.',board,answer,'x',
  ['Dragðu töluna sem bætist við x frá báðum hliðum.',
   'Þú færð '+v('x')+' = '+fmt(b)+' − '+fmt(a)+'.'],
  steps(board,v('x')+' = '+fmt(b)+' − '+fmt(a),solution('x',answer))+verify(fmt(answer)+' + '+fmt(a),b));
 [a,b]=p.subtract;board=L(1,-a)+' = '+fmt(b);answer=a+b;
 num(0,'Bættu við báðum megin','Leystu jöfnuna.',board,answer,'x',
  ['Bættu '+fmt(a)+' við báðar hliðar til að einangra x.',
   'Þá verður '+v('x')+' = '+fmt(b)+' + '+fmt(a)+'.'],
  steps(board,L(1,-a)+' + '+fmt(a)+' = '+fmt(b)+' + '+fmt(a),solution('x',answer))+verify(fmt(answer)+' − '+fmt(a),b));

 [a,b]=p.reverse;board=fmt(a)+' = '+fmt(b)+' + '+v('x');answer=a-b;
 num(1,'Óþekkta talan hægra megin','Leystu jöfnuna. Svarið má vera neikvætt.',board,answer,'x',
  ['Þú mátt vinna með jöfnuna þótt x sé hægra megin.',
   'Dragðu '+fmt(b)+' frá báðum hliðum. Þá fæst '+fmt(a)+' − '+fmt(b)+' = '+v('x')+'.'],
  steps(board,fmt(a)+' − '+fmt(b)+' = '+fmt(b)+' + '+v('x')+' − '+fmt(b),fmt(answer)+' = '+v('x'),solution('x',answer))+verify(fmt(b)+' + '+par(answer),a));
 [a,b]=p.negative;board=fmt(a)+' = '+L(1,-b,'y');answer=a+b;
 num(1,'Neikvæð tala og frádráttur','Einangraðu y og finndu gildið.',board,answer,'y',
  ['Bættu '+fmt(b)+' við báðar hliðar. Þá stendur y eitt og sér hægra megin.',

  steps(board,fmt(a)+' + '+fmt(b)+' = '+L(1,-b,'y')+' + '+fmt(b),fmt(answer)+' = '+v('y'),solution('y',answer))+verify(par(answer)+' − '+fmt(b),a));

 [a,b]=p.multiply;board=fmt(a)+v('x')+' = '+fmt(b);answer=b/a;
 mc(2,'Deildu með stuðlinum','Deildu báðum hliðum með '+fmt(a)+'. Hvaða jafna fæst?',board,
  [v('x')+' = '+frac(fmt(b),fmt(a)),v('x')+' = '+frac(fmt(-b),fmt(a)),v('x')+' = '+par(b)+' · '+fmt(a),v('x')+' = '+fmt(b)+' + '+fmt(a)],
  [fmt(a)+'x merkir '+fmt(a)+' · x. Deiling er andhverf aðgerð margföldunar.',
   'Deildu hægri hliðinni líka með '+fmt(a)+'. Neikvæð tala deilt með jákvæðri tölu er neikvæð.'],
  steps(board,frac(fmt(a)+v('x'),fmt(a))+' = '+frac(fmt(b),fmt(a)),solution('x',answer))+verify(fmt(a)+' · '+par(answer),b),
  'Deildu með stuðlinum. Haltu mínusmerkinu á tölunni hægra megin.');
 [a,b]=p.divide;board=frac(v('x'),fmt(a))+' = '+fmt(b);answer=a*b;
 num(2,'Margfaldaðu með nefnaranum','Leystu jöfnuna.',board,answer,'x',
  ['Brotastrikið merkir deilingu. Til að eyða deilingu með '+fmt(a)+' margfaldarðu báðar hliðar með '+fmt(a)+'.',
   'Þú færð '+v('x')+' = '+fmt(a)+' · '+par(b)+'.'],
  steps(board,fmt(a)+' · '+frac(v('x'),fmt(a))+' = '+fmt(a)+' · '+par(b),solution('x',answer))+verify(frac(fmt(answer),fmt(a)),b));

 [a,b]=p.decimal;board=fmt(a)+v('s')+' = '+fmt(b);answer=b/a;
 num(3,'Tugabrot sem stuðull','Leystu jöfnuna. Þú mátt nota reiknivél við deilinguna.',board,answer,'s',
  ['Talan fyrir framan s er stuðull. Deildu báðum hliðum með honum.',
   'Reiknaðu '+frac(fmt(b),fmt(a))+'. Þú mátt nota kommu eða punkt í svarinu.'],
  steps(board,frac(fmt(a)+v('s'),fmt(a))+' = '+frac(fmt(b),fmt(a)),solution('s',answer))+verify(fmt(a)+' · '+fmt(answer),b));
 [a,b]=p.reverseFraction;board=fmt(a)+' = '+frac(v('z'),fmt(b));answer=a*b;
 num(3,'Tugabrot í nefnara','Einangraðu z. Óþekkta talan er hægra megin.',board,answer,'z',
  ['Hér er deilt með '+fmt(b)+'. Margfaldaðu því báðar hliðar með '+fmt(b)+'.',
   'Þá fæst '+fmt(a)+' · '+fmt(b)+' = '+v('z')+'.'],
  steps(board,fmt(a)+' · '+fmt(b)+' = '+frac(v('z'),fmt(b))+' · '+fmt(b),fmt(answer)+' = '+v('z'),solution('z',answer))+verify(frac(fmt(answer),fmt(b)),a));
 [a,b]=p.hundred;board=frac(v('s'),fmt(a))+' = '+fmt(b);answer=a*b;
 num(3,'Deiling með hundrað','Finndu s.',board,answer,'s',
  ['Til að eyða deilingu með '+fmt(a)+' margfaldarðu báðar hliðar með '+fmt(a)+'.',
   'Reiknaðu '+fmt(a)+' · '+fmt(b)+'. Athugaðu síðan með því að deila svarinu með '+fmt(a)+'.'],
  steps(board,fmt(a)+' · '+frac(v('s'),fmt(a))+' = '+fmt(a)+' · '+fmt(b),solution('s',answer))+verify(frac(fmt(answer),fmt(a)),b));

 [a,b]=p.small;board=fmt(a)+v('x')+' = '+fmt(b);answer=b/a;
 mc(4,'Stuðull minni en einn','Hvaða reikningur gefur gildið á x?',board,
  [v('x')+' = '+frac(fmt(b),fmt(a)),v('x')+' = '+fmt(b)+' · '+fmt(a),v('x')+' = '+frac(fmt(a),fmt(b)),v('x')+' = '+fmt(b)+' − '+fmt(a)],
  ['Aðferðin er sú sama þótt stuðullinn sé minni en einn: deildu með stuðlinum.',
   'Til að fá x eitt og sér þarf að reikna '+frac(fmt(b),fmt(a))+'.'],
  steps(board,frac(fmt(a)+v('x'),fmt(a))+' = '+frac(fmt(b),fmt(a)),solution('x',answer))+verify(fmt(a)+' · '+fmt(answer),b),
  'Hér þarf að deila, ekki margfalda. Reikningurinn er hægri hliðin deilt með stuðlinum.');
 [a,b]=p.overOne;board=fmt(a)+v('x')+' = '+fmt(b);answer=b/a;
 num(4,'Stuðull stærri en einn','Leystu jöfnuna. Notaðu reiknivél eftir þörfum.',board,answer,'x',
  ['Deildu báðum hliðum með '+fmt(a)+'.',
   'Skráðu '+fmt(b)+' ÷ '+fmt(a)+' í reiknivélina. Athugaðu svo hvort margfeldi svarsins og '+fmt(a)+' sé '+fmt(b)+'.'],
  steps(board,frac(fmt(a)+v('x'),fmt(a))+' = '+frac(fmt(b),fmt(a)),solution('x',answer))+verify(fmt(a)+' · '+fmt(answer),b));
 [a,b]=p.precise;board=fmt(a)+v('x')+' = '+fmt(b);answer=b/a;
 num(4,'Þrír aukastafir í stuðlinum','Leystu jöfnuna. Ekki námunda stuðulinn.',board,answer,'x',
  ['Deildu með nákvæmlega '+fmt(a)+'. Allir aukastafirnir skipta máli.',
   'Reiknaðu '+frac(fmt(b),fmt(a))+'. Notaðu svo margföldun til að athuga svarið.'],
  steps(board,frac(fmt(a)+v('x'),fmt(a))+' = '+frac(fmt(b),fmt(a)),solution('x',answer))+verify(fmt(a)+' · '+fmt(answer),b));
 [a,b]=p.tiny;board=fmt(a)+v('x')+' = '+fmt(b);answer=b/a;
 num(4,'Mjög lítill stuðull','Leystu jöfnuna. Hér getur lausnin verið stór tala.',board,answer,'x',
  ['Deildu með '+fmt(a)+'. Ekki sleppa núllum úr tugabrotinu.',
   'Reiknaðu '+frac(fmt(b),fmt(a))+'. Stór lausn getur verið rétt því stuðullinn er mjög lítill.'],
  steps(board,frac(fmt(a)+v('x'),fmt(a))+' = '+frac(fmt(b),fmt(a)),solution('x',answer))+verify(fmt(a)+' · '+fmt(answer),b));
 return {questions:qs,parameters:p};
}
function parseNumber(value){
 const clean=String(value).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/,/g,'.');
 const pattern=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/;
 if(!clean)return null;
 const bits=clean.split('/');
 if(bits.length>2||!bits.every(b=>pattern.test(b)))return null;
 const nums=bits.map(Number);
 if(nums.some(n=>!Number.isFinite(n))||(bits.length===2&&nums[1]===0))return null;
 return bits.length===2?nums[0]/nums[1]:nums[0];
}
function isCorrect(q,record){
 if(q.type==='choice')return record.choice===q.correct;
 const n=parseNumber(record.answer);return n!==null&&Math.abs(n-q.answer)<1e-9;
}
const cleanRecord=()=>({choice:null,answer:'',done:false,hints:0,attempts:0});
const cleanState=(seed=0)=>({version:VERSION,seed:seed%2,cursor:0,records:build(seed).questions.map(cleanRecord)});
function validState(s){
 const integer=(x,a,b)=>Number.isSafeInteger(x)&&x>=a&&x<=b;
 if(!s||s.version!==VERSION||!integer(s.seed,0,1))return false;
 const qs=build(s.seed).questions;
 if(!integer(s.cursor,0,qs.length)||!Array.isArray(s.records)||s.records.length!==qs.length)return false;
 return s.records.every((r,i)=>r&&typeof r==='object'&&(r.choice===null||integer(r.choice,0,(qs[i].options?.length??0)-1))&&typeof r.answer==='string'&&r.answer.length<=80&&typeof r.done==='boolean'&&integer(r.hints,0,qs[i].hints.length)&&integer(r.attempts,0,1000000)&&(!r.done||isCorrect(qs[i],r)));
}

const root=document.getElementById('ggj-lota16-timi5');
const $=id=>root.querySelector('#'+id);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageWorks=true,state,notice='';
let stored=null;
try{stored=localStorage.getItem(KEY);}catch{storageWorks=false;}
try{state=JSON.parse(stored);if(!validState(state))state=cleanState();}
catch{state=cleanState();}
let questions=build(state.seed).questions;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageWorks=false;}}
const storageText=()=>storageWorks?'Framvindan geymist í þessum vafra. Svör eru ekki send til kennara.':'Vafrinn leyfir ekki vistun. Framvindan helst meðan æfingin er opin.';
function groupIndices(g){return questions.map((q,i)=>q.group===g?i:-1).filter(i=>i>=0);}
function progress(){
 const total=state.records.filter(r=>r.done).length;
 const current=questions[state.cursor]?.group;
 $('progress').innerHTML=GROUPS.map((_,g)=>{const ids=groupIndices(g),done=ids.every(i=>state.records[i].done);return '<i class="'+(done?'done ':'')+(current===g?'current':'')+'"></i>';}).join('');
 $('progress').setAttribute('aria-valuenow',String(total));
 $('progress').setAttribute('aria-valuemax',String(questions.length));
 $('progress').setAttribute('aria-valuetext',total+' af '+questions.length+' spurningum lokið');
}
function feedback(q,r){
 $('feedback').innerHTML=r.done?'<div class="feedback success"><strong>Rétt hjá þér</strong>'+q.explain+'</div>':notice?'<div class="feedback"><strong>Skoðum þetta aðeins</strong>'+notice+'</div>':'';
 $('hints').innerHTML=r.hints?'<div class="hint-box"><strong>Vísbending'+(r.hints>1?'ar':'')+'</strong>'+q.hints.slice(0,r.hints).map(h=>'<p>'+h+'</p>').join('')+'</div>':'';
}
function render(focus=false){
 save();progress();
 if(state.cursor===questions.length){summary(focus);return;}
 const q=questions[state.cursor],r=state.records[state.cursor];
 $('stepcount').textContent='Hluti '+(q.group+1)+' af '+GROUPS.length;
 $('subcount').textContent='Spurning '+(state.cursor+1)+' af '+questions.length;
 const isFigure=q.board.startsWith('<svg'),isWords=q.board.startsWith('<div');
 let inputs='';
 if(q.type==='choice'){
 inputs='<div class="choices" role="group" aria-label="Svarmöguleikar">'+q.options.map((o,i)=>'<button type="button" class="choice '+(r.choice===i?'selected ':'')+(r.done&&r.choice===i?'correct':'')+'" data-choice="'+i+'" aria-pressed="'+(r.choice===i)+'" '+(r.done?'disabled':'')+'><span class="letter" aria-hidden="true">'+String.fromCharCode(65+i)+'</span><span class="math">'+o+'</span></button>').join('')+'</div>';
 }else{
 inputs='<div class="answer-field"><label for="answer">'+escape(q.label)+(q.unit?' ('+escape(q.unit)+')':'')+'</label><div class="input-row"><input id="answer" type="text" inputmode="text" maxlength="80" autocomplete="off" aria-describedby="input-help" value="'+escape(r.answer)+'" '+(r.done?'disabled':'')+'><span class="unit">'+escape(q.unit)+'</span></div><p id="input-help" class="input-help">Skrifaðu tölu eða almennt brot, til dæmis −1,5 eða −3/2. Þú mátt nota kommu eða punkt í tugabroti.</p></div>';
 }
 $('exercise').innerHTML='<div class="eyebrow">'+GROUPS[q.group]+'</div><h1 id="heading" tabindex="-1">'+q.title+'</h1><p class="intro">'+q.intro+'</p><div class="board '+(isFigure?'figure-board':'algebra-board')+'">'+(isFigure||isWords?q.board:'<div class="equation">'+q.board+'</div>')+'</div>'+inputs;
 $('back').disabled=state.cursor===0;
 $('hint').hidden=false;$('hint').disabled=r.done||r.hints>=q.hints.length;
 $('check').hidden=false;$('check').textContent=r.done?(state.cursor===questions.length-1?'Skoða yfirlit →':'Áfram →'):'Athuga svar →';
 feedback(q,r);
 root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
  if(r.done)return;
  r.choice=Number(b.dataset.choice);notice='';render();
  root.querySelector('[data-choice="'+r.choice+'"]')?.focus({preventScroll:true});
 });
 if($('answer')){
  $('answer').oninput=e=>{r.answer=e.target.value;notice='';$('feedback').innerHTML='';save();};
  $('answer').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
 }
 if(focus)$('heading').focus({preventScroll:true});
}
function check(){
 if(state.cursor===questions.length)return;
 const q=questions[state.cursor],r=state.records[state.cursor];
 if(r.done){state.cursor++;notice='';render(true);return;}
 if(q.type==='choice'&&r.choice===null){notice='Veldu svarmöguleika fyrst.';feedback(q,r);return;}
 if(q.type==='number'&&parseNumber(r.answer)===null){notice='Skráðu tölu eða almennt brot í svarreitinn. Ef þú notar brot má nefnarinn ekki vera núll.';feedback(q,r);$('answer').focus();return;}
 r.attempts++;r.done=isCorrect(q,r);
 notice=r.done?'':q.wrong||'Skoðaðu útreikningana aftur. Vísbendingin getur hjálpað þér að finna næsta skref.';
 render();
 if(r.done)$('check').focus({preventScroll:true});
 else if(q.type==='number'){$('answer').focus({preventScroll:true});$('answer').select();}
}
function summary(focus=false){
 const total=state.records.filter(r=>r.done).length,complete=total===questions.length;
 $('stepcount').textContent='Yfirlit';$('subcount').textContent=total+' af '+questions.length+' lokið';
 $('hint').hidden=true;$('check').hidden=true;$('back').disabled=false;
 $('feedback').innerHTML='';$('hints').innerHTML='';
 $('exercise').innerHTML='<div class="summary"><div class="seal" aria-hidden="true">'+(complete?'✓':'↗')+'</div><div class="eyebrow">Lota 16 · 5. tími</div><h1 id="heading" tabindex="-1">'+(complete?'Vel gert. Æfingunni er lokið.':'Haltu áfram með æfinguna.')+'</h1><p class="intro">'+(complete?'Þú hefur einangrað óþekktar tölur, notað sömu aðgerð báðum megin og leyst jöfnur með neikvæðum tölum og tugabrotum.':'Þú hefur lokið '+total+' spurningum. Veldu hluta í yfirlitinu eða haltu áfram með næstu spurningu sem þú átt eftir.')+'</p><ul class="summary-list">'+GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<li class="'+(done===ids.length?'finished':'unfinished')+'">'+name+' <span>'+done+'/'+ids.length+'</span></li>';}).join('')+'</ul><button type="button" class="primary" id="again">'+(complete?'Æfa aftur með nýjum tölum':'Halda áfram')+' →</button><p class="storage-note">'+storageText()+'</p></div>';
 $('again').onclick=()=>{
  if(complete){state=cleanState((state.seed+1)%2);questions=build(state.seed).questions;}
  else state.cursor=state.records.findIndex(r=>!r.done);
  notice='';render(true);
 };
 if(focus)$('heading').focus({preventScroll:true});
}
$('check').onclick=check;
$('hint').onclick=()=>{if(state.cursor>=questions.length)return;const r=state.records[state.cursor],q=questions[state.cursor];if(!r.done){r.hints=Math.min(r.hints+1,q.hints.length);save();feedback(q,r);$('hint').disabled=r.hints>=q.hints.length;}};
$('back').onclick=()=>{if(state.cursor>0){state.cursor--;notice='';render(true);}};
$('outline').onclick=()=>{
 $('outlineItems').innerHTML=GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<button type="button" class="outline-item" data-group="'+g+'"><span>'+String(g+1).padStart(2,'0')+'</span>'+name+'<small>'+done+'/'+ids.length+' lokið</small></button>';}).join('')+'<button type="button" class="outline-item" id="showSummary">Skoða stöðu æfingarinnar →</button>';
 $('storageNote').textContent=storageText();
 root.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const ids=groupIndices(Number(b.dataset.group));state.cursor=ids.find(i=>!state.records[i].done)??ids[0];notice='';$('outlineDialog').close();render(true);});
 $('showSummary').onclick=()=>{state.cursor=questions.length;notice='';$('outlineDialog').close();render(true);};
 $('outlineDialog').showModal();
};
$('closeDialog').onclick=()=>$('outlineDialog').close();
$('outlineDialog').addEventListener('click',e=>{if(e.target===$('outlineDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
render();

})();
</script>
