<script>
(function(){'use strict';

const VERSION=1,KEY='ggj-lota16-timi06-aefing-v1';
const GROUPS=['Óþekkta talan hægra megin','Tugabrot og formerki','x báðum megin','Draga saman líka liði','Neikvæðir stuðlar','Athugun með innsetningu'];
const fmt=n=>String(Math.round(n*1e10)/1e10).replace('.',',').replace(/-/g,'−');
const v=s=>'<i>'+s+'</i>';
const pow=s=>v(s)+'<sup>2</sup>';
function poly(terms){let out='';for(const [n,s] of terms){if(!n)continue;let a=Math.abs(n),body=(a===1&&s?'':fmt(a))+s;out+=(out?(n<0?' − ':' + '):(n<0?'−':''))+body;}return out||'0';}
const PX=(a,b,c=0)=>poly([[a,pow('x')],[b,v('x')],[c,'']]);
const LX=(a,b)=>poly([[a,v('x')],[b,'']]);
const frac=(a,b)=>'<span class="fraction"><span>'+a+'</span><span>'+b+'</span></span>';
const eqs=(start,...lines)=>'<div class="math-steps"><div>'+start+'</div>'+lines.map(s=>'<div>= '+s+'</div>').join('')+'</div>';
function build(seed=0){
 const p=seed%2===0?
 {reverse:[27,11],reverseMinus:[-13,21],decimalPlus:[1.4,1.9],decimalMinus:[0.7,-1.1],decimalLong:[0.48,84.6],both:[12,7,20],opposite:[8,45,1],combine:[10,6,3,2,25,4],combine2:[7,5,2,19,3],negative:[9,21,4],negativeBoth:[7,4,19,6],proof:[6,5,2,-4,3,7]}:
 {reverse:[31,14],reverseMinus:[-17,25],decimalPlus:[1.6,2.3],decimalMinus:[0.8,-1.3],decimalLong:[0.37,92.5],both:[11,5,30],opposite:[9,56,5],combine:[12,7,4,3,32,5],combine2:[8,4,3,26,4],negative:[11,26,3],negativeBoth:[8,5,23,8],proof:[7,4,3,-5,2,3]};
 const qs=[];
 const mc=(group,title,intro,board,options,hints,explain,wrong,variable='x',extra={})=>{
  const offset=(qs.length+seed)%options.length;
  const rotated=options.map((html,i)=>({html,correct:i===0}));
  for(let k=0;k<offset;k++)rotated.push(rotated.shift());
  qs.push({group,title,intro,board,type:'choice',variable,options:rotated.map(o=>o.html),correct:rotated.findIndex(o=>o.correct),hints,explain,wrong,...extra});
 };
 const num=(group,title,intro,board,answer,variable,hints,explain)=>
  qs.push({group,title,intro,board,type:'number',variable,answer:Math.round(answer*1e10)/1e10,label:variable+' =',unit:'',hints,explain});
 const L=(a,b,letter='x')=>poly([[a,v(letter)],[b,'']]);
 const steps=(...lines)=>'<div class="math-steps">'+lines.filter((line,index,all)=>index===0||line!==all[index-1]).map(s=>'<div>'+s+'</div>').join('')+'</div>';
 const solution=(variable,answer)=>v(variable)+' = '+fmt(answer);
 const par=n=>n<0?'('+fmt(n)+')':fmt(n);
 const verify=(left,right)=>'<p>Athugun: <span class="math">'+left+' = '+right+'</span>.</p>';
 const times=(a,b)=>fmt(a)+' · '+par(b);
 let a,b,c,d,e,f,board,answer,left,right;

 [a,b]=p.reverse;board=fmt(a)+' = '+fmt(b)+' + '+v('y');answer=a-b;
 num(0,'Óþekkta talan hægra megin','Leystu jöfnuna.',board,answer,'y',
  ['Þú mátt draga sömu tölu frá báðum hliðum þótt y sé hægra megin.',
   'Dragðu '+fmt(b)+' frá báðum hliðum: '+fmt(a)+' − '+fmt(b)+' = '+v('y')+'.'],
  steps(board,fmt(a)+' − '+fmt(b)+' = '+fmt(b)+' + '+v('y')+' − '+fmt(b),fmt(answer)+' = '+v('y'),solution('y',answer))+verify(fmt(a),fmt(b)+' + '+par(answer)));
 [a,b]=p.reverseMinus;board=fmt(a)+' = '+L(1,-b,'t');answer=a+b;

function parseNumber(value){
 const clean=String(value).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/,/g,'.');
 const pattern=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/;
 if(!clean)return null;
 const bits=clean.split('/');
 if(bits.length>2||!bits.every(b=>pattern.test(b)))return null;
 const nums=bits.map(Number);
 if(nums.some(n=>!Number.isFinite(n))||(bits.length===2&&nums[1]===0))return null;
 return bits.length===2?nums[0]/nums[1]:nums[0];
}
function isCorrect(q,record){
 if(q.type==='choice')return record.choice===q.correct;
 const n=parseNumber(record.answer);return n!==null&&Math.abs(n-q.answer)<1e-9;
}
const cleanRecord=()=>({choice:null,answer:'',done:false,hints:0,attempts:0});
const cleanState=(seed=0)=>({version:VERSION,seed:seed%2,cursor:0,records:build(seed).questions.map(cleanRecord)});
function validState(s){
 const integer=(x,a,b)=>Number.isSafeInteger(x)&&x>=a&&x<=b;
 if(!s||s.version!==VERSION||!integer(s.seed,0,1))return false;
 const qs=build(s.seed).questions;
 if(!integer(s.cursor,0,qs.length)||!Array.isArray(s.records)||s.records.length!==qs.length)return false;
 return s.records.every((r,i)=>r&&typeof r==='object'&&(r.choice===null||integer(r.choice,0,(qs[i].options?.length??0)-1))&&typeof r.answer==='string'&&r.answer.length<=80&&typeof r.done==='boolean'&&integer(r.hints,0,qs[i].hints.length)&&integer(r.attempts,0,1000000)&&(!r.done||isCorrect(qs[i],r)));
}

const root=document.getElementById('ggj-lota16-timi6');
const $=id=>root.querySelector('#'+id);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageWorks=true,state,notice='';
let stored=null;
try{stored=localStorage.getItem(KEY);}catch{storageWorks=false;}
try{state=JSON.parse(stored);if(!validState(state))state=cleanState();}
catch{state=cleanState();}
let questions=build(state.seed).questions;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageWorks=false;}}
const storageText=()=>storageWorks?'Framvindan geymist í þessum vafra. Svör eru ekki send til kennara.':'Vafrinn leyfir ekki vistun. Framvindan helst meðan æfingin er opin.';
function groupIndices(g){return questions.map((q,i)=>q.group===g?i:-1).filter(i=>i>=0);}
function progress(){
 const total=state.records.filter(r=>r.done).length;
 const current=questions[state.cursor]?.group;
 $('progress').innerHTML=GROUPS.map((_,g)=>{const ids=groupIndices(g),done=ids.every(i=>state.records[i].done);return '<i class="'+(done?'done ':'')+(current===g?'current':'')+'"></i>';}).join('');
 $('progress').setAttribute('aria-valuenow',String(total));
 $('progress').setAttribute('aria-valuemax',String(questions.length));
 $('progress').setAttribute('aria-valuetext',total+' af '+questions.length+' spurningum lokið');
}
function feedback(q,r){
 $('feedback').innerHTML=r.done?'<div class="feedback success"><strong>Rétt hjá þér</strong>'+q.explain+'</div>':notice?'<div class="feedback"><strong>Skoðum þetta aðeins</strong>'+notice+'</div>':'';
 $('hints').innerHTML=r.hints?'<div class="hint-box"><strong>Vísbending'+(r.hints>1?'ar':'')+'</strong>'+q.hints.slice(0,r.hints).map(h=>'<p>'+h+'</p>').join('')+'</div>':'';
}
function render(focus=false){
 save();progress();
 if(state.cursor===questions.length){summary(focus);return;}
 const q=questions[state.cursor],r=state.records[state.cursor];
 $('stepcount').textContent='Hluti '+(q.group+1)+' af '+GROUPS.length;
 $('subcount').textContent='Spurning '+(state.cursor+1)+' af '+questions.length;
 const isFigure=q.board.startsWith('<svg'),isWords=q.board.startsWith('<div');
 let inputs='';
 if(q.type==='choice'){
 inputs='<div class="choices" role="group" aria-label="Svarmöguleikar">'+q.options.map((o,i)=>'<button type="button" class="choice '+(r.choice===i?'selected ':'')+(r.done&&r.choice===i?'correct':'')+'" data-choice="'+i+'" aria-pressed="'+(r.choice===i)+'" '+(r.done?'disabled':'')+'><span class="letter" aria-hidden="true">'+String.fromCharCode(65+i)+'</span><span class="math">'+o+'</span></button>').join('')+'</div>';
 }else{
 inputs='<div class="answer-field"><label for="answer">'+escape(q.label)+(q.unit?' ('+escape(q.unit)+')':'')+'</label><div class="input-row"><input id="answer" type="text" inputmode="text" maxlength="80" autocomplete="off" aria-describedby="input-help" value="'+escape(r.answer)+'" '+(r.done?'disabled':'')+'><span class="unit">'+escape(q.unit)+'</span></div><p id="input-help" class="input-help">Skrifaðu tölu eða almennt brot, til dæmis −1,5 eða −3/2. Þú mátt nota kommu eða punkt í tugabroti.</p></div>';
 }
 $('exercise').innerHTML='<div class="eyebrow">'+GROUPS[q.group]+'</div><h1 id="heading" tabindex="-1">'+q.title+'</h1><p class="intro">'+q.intro+'</p><div class="board '+(isFigure?'figure-board':'algebra-board')+'">'+(isFigure||isWords?q.board:'<div class="equation">'+q.board+'</div>')+'</div>'+inputs;
 $('back').disabled=state.cursor===0;
 $('hint').hidden=false;$('hint').disabled=r.done||r.hints>=q.hints.length;
 $('check').hidden=false;$('check').textContent=r.done?(state.cursor===questions.length-1?'Skoða yfirlit →':'Áfram →'):'Athuga svar →';
 feedback(q,r);
 root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
  if(r.done)return;

 });
 if($('answer')){
  $('answer').oninput=e=>{r.answer=e.target.value;notice='';$('feedback').innerHTML='';save();};
  $('answer').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
 }
 if(focus)$('heading').focus({preventScroll:true});

function check(){
 if(state.cursor===questions.length)return;
 const q=questions[state.cursor],r=state.records[state.cursor];
 if(r.done){state.cursor++;notice='';render(true);return;}
 if(q.type==='choice'&&r.choice===null){notice='Veldu svarmöguleika fyrst.';feedback(q,r);return;}
 if(q.type==='number'&&parseNumber(r.answer)===null){notice='Skráðu tölu eða almennt brot í svarreitinn. Ef þú notar brot má nefnarinn ekki vera núll.';feedback(q,r);$('answer').focus();return;}
 r.attempts++;r.done=isCorrect(q,r);
 notice=r.done?'':q.wrong||'Skoðaðu útreikningana aftur. Vísbendingin getur hjálpað þér að finna næsta skref.';
 render();
 if(r.done)$('check').focus({preventScroll:true});
 else if(q.type==='number'){$('answer').focus({preventScroll:true});$('answer').select();}
}
function summary(focus=false){
 const total=state.records.filter(r=>r.done).length,complete=total===questions.length;
 $('stepcount').textContent='Yfirlit';$('subcount').textContent=total+' af '+questions.length+' lokið';
 $('hint').hidden=true;$('check').hidden=true;$('back').disabled=false;
 $('feedback').innerHTML='';$('hints').innerHTML='';
 $('exercise').innerHTML='<div class="summary"><div class="seal" aria-hidden="true">'+(complete?'✓':'↗')+'</div><div class="eyebrow">Lota 16 · 6. tími</div><h1 id="heading" tabindex="-1">'+(complete?'Vel gert. Æfingunni er lokið.':'Haltu áfram með æfinguna.')+'</h1><p class="intro">'+(complete?'Þú hefur leyst jöfnur með x báðum megin, dregið saman líka liði, unnið með neikvæða stuðla og prófað lausn í upphaflegri jöfnu.':'Þú hefur lokið '+total+' spurningum. Veldu hluta í yfirlitinu eða haltu áfram með næstu spurningu sem þú átt eftir.')+'</p><ul class="summary-list">'+GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<li class="'+(done===ids.length?'finished':'unfinished')+'">'+name+' <span>'+done+'/'+ids.length+'</span></li>';}).join('')+'</ul><button type="button" class="primary" id="again">'+(complete?'Æfa aftur með nýjum tölum':'Halda áfram')+' →</button><p class="storage-note">'+storageText()+'</p></div>';
 $('again').onclick=()=>{
  if(complete){state=cleanState((state.seed+1)%2);questions=build(state.seed).questions;}
  else state.cursor=state.records.findIndex(r=>!r.done);
  notice='';render(true);
 };
 if(focus)$('heading').focus({preventScroll:true});
}
$('check').onclick=check;
$('hint').onclick=()=>{if(state.cursor>=questions.length)return;const r=state.records[state.cursor],q=questions[state.cursor];if(!r.done){r.hints=Math.min(r.hints+1,q.hints.length);save();feedback(q,r);$('hint').disabled=r.hints>=q.hints.length;}};
$('back').onclick=()=>{if(state.cursor>0){state.cursor--;notice='';render(true);}};
$('outline').onclick=()=>{
 $('outlineItems').innerHTML=GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<button type="button" class="outline-item" data-group="'+g+'"><span>'+String(g+1).padStart(2,'0')+'</span>'+name+'<small>'+done+'/'+ids.length+' lokið</small></button>';}).join('')+'<button type="button" class="outline-item" id="showSummary">Skoða stöðu æfingarinnar →</button>';
 $('storageNote').textContent=storageText();
 root.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const ids=groupIndices(Number(b.dataset.group));state.cursor=ids.find(i=>!state.records[i].done)??ids[0];notice='';$('outlineDialog').close();render(true);});

};
$('closeDialog').onclick=()=>$('outlineDialog').close();
$('outlineDialog').addEventListener('click',e=>{if(e.target===$('outlineDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
render();

})();
