<script>
(function(){'use strict';

const VERSION=1,KEY='ggj-lota16-timi04-aefing-v1';
const GROUPS=['Plús í sviga','Mínus í sviga','Tveir bókstafir','Stuðlar og röð','Tugabrot og brot'];
const fmt=n=>String(Math.round(n*1e10)/1e10).replace('.',',').replace(/-/g,'−');
const v=s=>'<i>'+s+'</i>';
const pow=s=>v(s)+'<sup>2</sup>';
function poly(terms){let out='';for(const [n,s] of terms){if(!n)continue;let a=Math.abs(n),body=(a===1&&s?'':fmt(a))+s;out+=(out?(n<0?' − ':' + '):(n<0?'−':''))+body;}return out||'0';}
const PX=(a,b,c=0)=>poly([[a,pow('x')],[b,v('x')],[c,'']]);
const LX=(a,b)=>poly([[a,v('x')],[b,'']]);
const frac=(a,b)=>'<span class="fraction"><span>'+a+'</span><span>'+b+'</span></span>';
const eqs=(start,...lines)=>'<div class="math-steps"><div>'+start+'</div>'+lines.map(s=>'<div>= '+s+'</div>').join('')+'</div>';
function build(seed=0){
 const p=seed%2===0?
 {positive:4,scaledPlus:[3,2],negative:6,scaledMinus:[4,3],constant:7,two:[2,3],coefficient:[4,5],reversed:[3,7],largeMinus:[2,8],decimal:[3,0.4],fraction:[2,5],reverseFraction:[3,5,2]}:
 {positive:6,scaledPlus:[2,7],negative:7,scaledMinus:[2,5],constant:8,two:[4,3],coefficient:[6,3],reversed:[4,6],largeMinus:[4,7],decimal:[2,0.3],fraction:[3,4],reverseFraction:[2,7,3]};
 const qs=[];
 const mc=(group,title,intro,board,options,hints,explain,wrong)=>{
  const offset=(qs.length+seed)%options.length;
  const rotated=options.map((html,i)=>({html,correct:i===0}));
  for(let k=0;k<offset;k++)rotated.push(rotated.shift());
  qs.push({group,title,intro,board,type:'choice',options:rotated.map(o=>o.html),correct:rotated.findIndex(o=>o.correct),hints,explain,wrong});
 };
 const num=(group,title,intro,board,answer,label,hints,explain)=>
  qs.push({group,title,intro,board,type:'number',answer,label,unit:'',hints,explain});
 const P=(a,b,c,letter='x')=>poly([[a,pow(letter)],[b,v(letter)],[c,'']]);
 const L=(a,b,letter='x')=>poly([[a,v(letter)],[b,'']]);
 const bracket=s=>'('+s+')';
 const square=s=>bracket(s)+'<sup>2</sup>';
 const double=(a,b,c)=>poly([[a,pow('y')],[b,v('y')+v('z')],[c,pow('z')]]);
 const gcd=(a,b)=>b?gcd(b,a%b):a;
 const F=(n,d)=>{const g=gcd(n,d);return d/g===1?fmt(n/g):frac(n/g,d/g);};
 let a,b,c,board,answer,inside;

 a=p.positive;inside=L(1,a);board=square(inside);
 mc(0,'Hvað merkir veldisvísirinn 2?','Veldu margfeldið sem er jafnt stæðunni.',board,
  [bracket(inside)+bracket(inside),bracket(inside)+bracket(L(1,-a)),'2'+bracket(inside),P(1,0,a*a)],
  ['Veldisvísirinn 2 merkir að öll stæðan í sviganum margfaldast með sjálfri sér.',
   'Skrifaðu sömu stæðuna tvisvar, með plúsmerki í báðum svigum.'],
  eqs(board,bracket(inside)+bracket(inside))+'<p>Veldið á við allan svigann, ekki aðeins bókstafinn.</p>',
  'Stæðan í sviganum þarf að margfaldast með sjálfri sér. Að tvöfalda stæðuna eða skipta um formerki gefur annað.');
 mc(0,'Ekki gleyma miðliðnum','Margfaldaðu sömu stæðu með sjálfri sér og dragðu saman líka liði.',board,
  [P(1,2*a,a*a),P(1,0,a*a),P(1,a,a*a),P(1,2*a,2*a)],
  ['Fyrri ferningsreglan er (A + B)² = A² + 2AB + B².',
   'Miðliðurinn er 2 · '+v('x')+' · '+fmt(a)+'. Hann kemur úr tveimur eins margfeldum.'],
  eqs(board,poly([[1,pow('x')],[a,v('x')],[a,v('x')],[a*a,'']]),P(1,2*a,a*a)),
  'Miðliðurinn er tvöfalt margfeldi liðanna. Fastaliðurinn er ferningur tölunnar í sviganum.');
 [a,b]=p.scaledPlus;board=square(L(a,b));answer=2*a*b;
 num(0,'Reiknaðu miðliðinn','Notaðu fyrri ferningsregluna og finndu stuðulinn k.',
  board+' = '+fmt(a*a)+pow('x')+' + '+v('k')+v('x')+' + '+fmt(b*b),answer,'k =',
  ['Miðliðurinn er 2 sinnum fyrri liðurinn sinnum síðari liðurinn.',

  eqs(board,square(fmt(a)+v('x'))+' + 2 · '+fmt(a)+v('x')+' · '+fmt(b)+' + '+fmt(b)+'<sup>2</sup>',P(a*a,answer,b*b))+'<p>'+v('k')+' = '+fmt(answer)+'.</p>');

 a=p.negative;board=square(L(1,-a));
 mc(1,'Mínus í sviga','Notaðu seinni ferningsregluna.',board,
  [P(1,-2*a,a*a),P(1,-2*a,-a*a),P(1,0,-a*a),P(1,2*a,a*a)],
  ['Seinni ferningsreglan er (A − B)² = A² − 2AB + B².',
   'Stuðull miðliðarins er neikvæður. Fastaliðurinn er jákvæður því ('+fmt(-a)+') · ('+fmt(-a)+') er jákvætt.'],
  eqs(board,bracket(L(1,-a))+bracket(L(1,-a)),P(1,-2*a,a*a)),
  'Notaðu alla þrjá liði seinni ferningsreglunnar: A² − 2AB + B².');
 [a,b]=p.scaledMinus;board=square(L(a,-b));answer=-2*a*b;
 num(1,'Neikvæður stuðull','Finndu stuðulinn k, með réttu formerki.',
  board+' = '+fmt(a*a)+pow('x')+' + '+v('k')+v('x')+' + '+fmt(b*b),answer,'k =',
  ['Miðliðurinn er −2 sinnum fyrri liðurinn sinnum jákvæðu töluna í síðari liðnum.',
   'Reiknaðu −2 · '+fmt(a)+' · '+fmt(b)+'. Hér á k að vera neikvætt.'],
  eqs(board,square(fmt(a)+v('x'))+' − 2 · '+fmt(a)+v('x')+' · '+fmt(b)+' + '+fmt(b)+'<sup>2</sup>',P(a*a,answer,b*b))+'<p>'+v('k')+' = '+fmt(answer)+'.</p>');
 a=p.constant;board=square(L(1,-a,'b'));answer=a*a;
 num(1,'Formerki síðasta liðar','Hvaða fastaliður k fæst þegar þú leysir upp svigann?',
  board+' = '+pow('b')+' − '+fmt(2*a)+v('b')+' + '+v('k'),answer,'k =',
  ['Síðasti liðurinn fæst úr neikvæðu tölunni margfaldaðri með sjálfri sér.',

  eqs(board,bracket(L(1,-a,'b'))+bracket(L(1,-a,'b')),P(1,-2*a,answer,'b'))+'<p>'+v('k')+' = '+fmt(answer)+'.</p>');

 [a,b]=p.two;inside=poly([[a,v('y')],[b,v('z')]]);board=square(inside);
 mc(2,'Miðliður með yz','Notaðu ferningsreglu og einfaldaðu.',board,

  eqs(board,square(fmt(a)+v('y'))+' + 2 · '+fmt(a)+v('y')+' · '+fmt(b)+v('z')+' + '+square(fmt(b)+v('z')),double(a*a,2*a*b,b*b)),

 inside=poly([[a,v('y')],[-b,v('z')]]);board=square(inside);
 mc(2,'Sömu liðir með mínus','Notaðu seinni ferningsregluna. Athugaðu hvað breytist frá fyrri ferningsreglunni.',board,
  [double(a*a,-2*a*b,b*b),double(a*a,-2*a*b,-b*b),double(a*a,2*a*b,b*b),double(a*a,0,-b*b)],
  ['Í seinni ferningsreglunni er mínusmerki fyrir framan tvöfalda margfeldið: A² − 2AB + B².',

  eqs(board,square(fmt(a)+v('y'))+' − 2 · '+fmt(a)+v('y')+' · '+fmt(b)+v('z')+' + '+square(fmt(b)+v('z')),double(a*a,-2*a*b,b*b)),
  'Miðliðurinn fær mínusmerki fyrir framan stuðulinn. Plúsmerki er fyrir framan ferning síðari liðarins.');

 [a,b]=p.coefficient;board=square(L(a,b));answer=a*a;
 num(3,'Stuðullinn fer líka í annað veldi','Hvaða stuðull k stendur við x²?',
  board+' = '+v('k')+pow('x')+' + '+fmt(2*a*b)+v('x')+' + '+fmt(b*b),answer,'k =',
  ['Fyrsti liðurinn er allur bókstafsliðurinn í öðru veldi.',
   square(fmt(a)+v('x'))+' = '+fmt(a)+' · '+fmt(a)+' · '+v('x')+' · '+v('x')+'.'],
  eqs(board,square(fmt(a)+v('x'))+' + 2 · '+fmt(a)+v('x')+' · '+fmt(b)+' + '+fmt(b)+'<sup>2</sup>',P(a*a,2*a*b,b*b))+'<p>'+v('k')+' = '+fmt(answer)+'.</p>');
 [a,b]=p.reversed;board=square(poly([[b,''],[a,v('x')]]));
 mc(3,'Talan kemur á undan','Leystu upp og skrifaðu stæðuna með x²-liðinn fyrst.',board,
  [P(a*a,2*a*b,b*b),P(a*a,a*b,b*b),P(a*a,2*a*b,b),P(a*a,0,b*b)],
  ['Þú mátt víxla liðum í samlagningu: '+fmt(b)+' + '+fmt(a)+v('x')+' = '+L(a,b)+'.',
   'Miðliðurinn er 2 · '+fmt(b)+' · '+fmt(a)+v('x')+'. Röðin í margfölduninni breytir ekki svarinu.'],
  eqs(board,square(L(a,b)),P(a*a,2*a*b,b*b)),
  'Notaðu alla þrjá liði ferningsreglunnar, þótt talan sé fyrst í sviganum.');
 [a,b]=p.largeMinus;board=square(L(a,-b,'a'));
 mc(3,'Stuðlar og frádráttur','Leystu upp og einfaldaðu.',board,
  [P(a*a,-2*a*b,b*b,'a'),P(a,-2*a*b,b*b,'a'),P(a*a,-a*b,b*b,'a'),P(a*a,-2*a*b,-b*b,'a')],
  ['Notaðu A² − 2AB + B² með A = '+fmt(a)+'a og B = '+fmt(b)+'.',
   'Reiknaðu tölurnar í liðunum þremur: '+fmt(a)+'², −2 · '+fmt(a)+' · '+fmt(b)+' og '+fmt(b)+'².'],
  eqs(board,square(fmt(a)+v('a'))+' − 2 · '+fmt(a)+v('a')+' · '+fmt(b)+' + '+fmt(b)+'<sup>2</sup>',P(a*a,-2*a*b,b*b,'a')),
  'Mundu að tvöfalda margfeldið í miðliðnum og setja hvorn lið svigans í annað veldi.');

 [a,b]=p.decimal;board=square(L(a,-b,'y'));
 mc(4,'Ferningsregla með tugabroti','Leystu upp og gefðu svarið með tugabrotum.',board,
  [P(a*a,-2*a*b,b*b,'y'),P(a*a,-2*a*b,-b*b,'y'),P(a*a,-a*b,b*b,'y'),P(a*a,-2*a*b,2*b,'y')],
  ['Sama regla gildir með tugabrotum: A² − 2AB + B².',
   'Miðliðurinn fæst úr −2 · '+fmt(a)+' · '+fmt(b)+'. Fastaliðurinn fæst úr '+fmt(b)+' · '+fmt(b)+'.'],
  eqs(board,square(fmt(a)+v('y'))+' − 2 · '+fmt(a)+v('y')+' · '+fmt(b)+' + '+fmt(b)+'<sup>2</sup>',P(a*a,-2*a*b,b*b,'y')),
  'Tugabrotið þarf að margfaldast með sjálfu sér í síðasta liðnum. Miðliðurinn er tvöfalt margfeldi með mínus.');
 [a,b]=p.fraction;const f=F(a,b);board=square(v('a')+' − '+f);
 const rational=(mid,constantSign=1)=>pow('a')+' − '+mid+v('a')+(constantSign===1?' + ':' − ')+F(a*a,b*b);
 mc(4,'Almennt brot í sviga','Leystu upp og haltu almennum brotum í svarinu.',board,
  [rational(F(2*a,b)),rational(F(a,b)),rational(F(2*a,b),-1),pow('a')+' − '+F(2*a,b)+v('a')+' + '+F(a*a,b)],
  ['Miðliðurinn er −2 sinnum a sinnum brotið.',
   'Í síðasta liðnum fara bæði teljari og nefnari í annað veldi. Styttu brotin ef hægt er.'],
  eqs(board,pow('a')+' − 2 · '+v('a')+' · '+f+' + '+square(f),rational(F(2*a,b))),
  'Mundu bæði að tvöfalda brotið í miðliðnum og setja teljara og nefnara í annað veldi í síðasta liðnum.');
 [a,b,c]=p.reverseFraction;const fRev=F(a,b),fConst=F(a*a,b*b),fMid=F(2*a*c,b);
 board=square(fRev+' − '+fmt(c)+v('a'));
 const base=fmt(c*c)+pow('a');
 mc(4,'Brotið kemur á undan mínusnum','Leystu upp og skrifaðu a²-liðinn fyrst. Gefðu svarið með almennum brotum.',board,
  [base+' − '+fMid+v('a')+' + '+fConst,base+' + '+fMid+v('a')+' + '+fConst,base+' − '+F(a*c,b)+v('a')+' + '+fConst,base+' − '+fMid+v('a')+' − '+fConst],
  ['Notaðu (A − B)² með A jafnt brotinu og B = '+fmt(c)+'a.',
   'Liðirnir verða '+square(fRev)+', −2 · '+fRev+' · '+fmt(c)+v('a')+' og '+square(fmt(c)+v('a'))+'. Raðaðu þeim síðan.'],
  eqs(board,square(fRev)+' − 2 · '+fRev+' · '+fmt(c)+v('a')+' + '+square(fmt(c)+v('a')),base+' − '+fMid+v('a')+' + '+fConst),
  'Stuðull miðliðarins er neikvæður. Plúsmerki eru fyrir framan ferningsliðina. Röð liðanna breytir ekki formerkjunum.');
 return {questions:qs,parameters:p};
}
function parseNumber(value){
 const clean=String(value).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/,/g,'.');
 const pattern=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/;
 if(!clean)return null;
 const bits=clean.split('/');
 if(bits.length>2||!bits.every(b=>pattern.test(b)))return null;
 const nums=bits.map(Number);
 if(nums.some(n=>!Number.isFinite(n))||(bits.length===2&&nums[1]===0))return null;
 return bits.length===2?nums[0]/nums[1]:nums[0];
}
function isCorrect(q,record){
 if(q.type==='choice')return record.choice===q.correct;
 const n=parseNumber(record.answer);return n!==null&&Math.abs(n-q.answer)<1e-9;
}
const cleanRecord=()=>({choice:null,answer:'',done:false,hints:0,attempts:0});
const cleanState=(seed=0)=>({version:VERSION,seed:seed%2,cursor:0,records:build(seed).questions.map(cleanRecord)});
function validState(s){
 const integer=(x,a,b)=>Number.isSafeInteger(x)&&x>=a&&x<=b;
 if(!s||s.version!==VERSION||!integer(s.seed,0,1))return false;
 const qs=build(s.seed).questions;
 if(!integer(s.cursor,0,qs.length)||!Array.isArray(s.records)||s.records.length!==qs.length)return false;
 return s.records.every((r,i)=>r&&typeof r==='object'&&(r.choice===null||integer(r.choice,0,(qs[i].options?.length??0)-1))&&typeof r.answer==='string'&&r.answer.length<=80&&typeof r.done==='boolean'&&integer(r.hints,0,qs[i].hints.length)&&integer(r.attempts,0,1000000)&&(!r.done||isCorrect(qs[i],r)));
}

const root=document.getElementById('ggj-lota16-timi4');
const $=id=>root.querySelector('#'+id);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageWorks=true,state,notice='';
let stored=null;
try{stored=localStorage.getItem(KEY);}catch{storageWorks=false;}
try{state=JSON.parse(stored);if(!validState(state))state=cleanState();}
catch{state=cleanState();}
let questions=build(state.seed).questions;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageWorks=false;}}
const storageText=()=>storageWorks?'Framvindan geymist í þessum vafra. Svör eru ekki send til kennara.':'Vafrinn leyfir ekki vistun. Framvindan helst meðan æfingin er opin.';
function groupIndices(g){return questions.map((q,i)=>q.group===g?i:-1).filter(i=>i>=0);}
function progress(){
 const total=state.records.filter(r=>r.done).length;
 const current=questions[state.cursor]?.group;
 $('progress').innerHTML=GROUPS.map((_,g)=>{const ids=groupIndices(g),done=ids.every(i=>state.records[i].done);return '<i class="'+(done?'done ':'')+(current===g?'current':'')+'"></i>';}).join('');
 $('progress').setAttribute('aria-valuenow',String(total));
 $('progress').setAttribute('aria-valuemax',String(questions.length));
 $('progress').setAttribute('aria-valuetext',total+' af '+questions.length+' spurningum lokið');
}
function feedback(q,r){
 $('feedback').innerHTML=r.done?'<div class="feedback success"><strong>Rétt hjá þér</strong>'+q.explain+'</div>':notice?'<div class="feedback"><strong>Skoðum þetta aðeins</strong>'+notice+'</div>':'';
 $('hints').innerHTML=r.hints?'<div class="hint-box"><strong>Vísbending'+(r.hints>1?'ar':'')+'</strong>'+q.hints.slice(0,r.hints).map(h=>'<p>'+h+'</p>').join('')+'</div>':'';
}
function render(focus=false){
 save();progress();
 if(state.cursor===questions.length){summary(focus);return;}
 const q=questions[state.cursor],r=state.records[state.cursor];
 $('stepcount').textContent='Hluti '+(q.group+1)+' af '+GROUPS.length;
 $('subcount').textContent='Spurning '+(state.cursor+1)+' af '+questions.length;
 const isFigure=q.board.startsWith('<svg'),isWords=q.board.startsWith('<div');
 let inputs='';
 if(q.type==='choice'){
 inputs='<div class="choices" role="group" aria-label="Svarmöguleikar">'+q.options.map((o,i)=>'<button type="button" class="choice '+(r.choice===i?'selected ':'')+(r.done&&r.choice===i?'correct':'')+'" data-choice="'+i+'" aria-pressed="'+(r.choice===i)+'" '+(r.done?'disabled':'')+'><span class="letter" aria-hidden="true">'+String.fromCharCode(65+i)+'</span><span class="math">'+o+'</span></button>').join('')+'</div>';
 }else{
 inputs='<div class="answer-field"><label for="answer">'+escape(q.label)+(q.unit?' ('+escape(q.unit)+')':'')+'</label><div class="input-row"><input id="answer" type="text" inputmode="text" maxlength="80" autocomplete="off" aria-describedby="input-help" value="'+escape(r.answer)+'" '+(r.done?'disabled':'')+'><span class="unit">'+escape(q.unit)+'</span></div><p id="input-help" class="input-help">Skrifaðu tölu eða almennt brot, til dæmis −1,5 eða −3/2. Þú mátt nota kommu eða punkt í tugabroti.</p></div>';
 }
 $('exercise').innerHTML='<div class="eyebrow">'+GROUPS[q.group]+'</div><h1 id="heading" tabindex="-1">'+q.title+'</h1><p class="intro">'+q.intro+'</p><div class="board '+(isFigure?'figure-board':'algebra-board')+'">'+(isFigure||isWords?q.board:'<div class="equation">'+q.board+'</div>')+'</div>'+inputs;
 $('back').disabled=state.cursor===0;
 $('hint').hidden=false;$('hint').disabled=r.done||r.hints>=q.hints.length;
 $('check').hidden=false;$('check').textContent=r.done?(state.cursor===questions.length-1?'Skoða yfirlit →':'Áfram →'):'Athuga svar →';
 feedback(q,r);
 root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
  if(r.done)return;
  r.choice=Number(b.dataset.choice);notice='';render();
  root.querySelector('[data-choice="'+r.choice+'"]')?.focus({preventScroll:true});
 });
 if($('answer')){
  $('answer').oninput=e=>{r.answer=e.target.value;notice='';$('feedback').innerHTML='';save();};
  $('answer').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
 }
 if(focus)$('heading').focus({preventScroll:true});
}
function check(){
 if(state.cursor===questions.length)return;
 const q=questions[state.cursor],r=state.records[state.cursor];
 if(r.done){state.cursor++;notice='';render(true);return;}
 if(q.type==='choice'&&r.choice===null){notice='Veldu svarmöguleika fyrst.';feedback(q,r);return;}
 if(q.type==='number'&&parseNumber(r.answer)===null){notice='Skráðu tölu eða almennt brot í svarreitinn. Ef þú notar brot má nefnarinn ekki vera núll.';feedback(q,r);$('answer').focus();return;}
 r.attempts++;r.done=isCorrect(q,r);
 notice=r.done?'':q.wrong||'Skoðaðu útreikningana aftur. Vísbendingin getur hjálpað þér að finna næsta skref.';
 render();
 if(r.done)$('check').focus({preventScroll:true});
 else if(q.type==='number'){$('answer').focus({preventScroll:true});$('answer').select();}
}
function summary(focus=false){
 const total=state.records.filter(r=>r.done).length,complete=total===questions.length;
 $('stepcount').textContent='Yfirlit';$('subcount').textContent=total+' af '+questions.length+' lokið';
 $('hint').hidden=true;$('check').hidden=true;$('back').disabled=false;
 $('feedback').innerHTML='';$('hints').innerHTML='';
 $('exercise').innerHTML='<div class="summary"><div class="seal" aria-hidden="true">'+(complete?'✓':'↗')+'</div><div class="eyebrow">Lota 16 · 4. tími</div><h1 id="heading" tabindex="-1">'+(complete?'Vel gert. Æfingunni er lokið.':'Haltu áfram með æfinguna.')+'</h1><p class="intro">'+(complete?'Þú hefur notað báðar ferningsreglurnar, reiknað miðliðinn og unnið með stuðla, tvo bókstafi, tugabrot og almenn brot.':'Þú hefur lokið '+total+' spurningum. Veldu hluta í yfirlitinu eða haltu áfram með næstu spurningu sem þú átt eftir.')+'</p><ul class="summary-list">'+GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<li class="'+(done===ids.length?'finished':'unfinished')+'">'+name+' <span>'+done+'/'+ids.length+'</span></li>';}).join('')+'</ul><button type="button" class="primary" id="again">'+(complete?'Æfa aftur með nýjum tölum':'Halda áfram')+' →</button><p class="storage-note">'+storageText()+'</p></div>';
 $('again').onclick=()=>{
  if(complete){state=cleanState((state.seed+1)%2);questions=build(state.seed).questions;}
  else state.cursor=state.records.findIndex(r=>!r.done);
  notice='';render(true);
 };
 if(focus)$('heading').focus({preventScroll:true});
}
$('check').onclick=check;
$('hint').onclick=()=>{if(state.cursor>=questions.length)return;const r=state.records[state.cursor],q=questions[state.cursor];if(!r.done){r.hints=Math.min(r.hints+1,q.hints.length);save();feedback(q,r);$('hint').disabled=r.hints>=q.hints.length;}};
$('back').onclick=()=>{if(state.cursor>0){state.cursor--;notice='';render(true);}};
$('outline').onclick=()=>{
 $('outlineItems').innerHTML=GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<button type="button" class="outline-item" data-group="'+g+'"><span>'+String(g+1).padStart(2,'0')+'</span>'+name+'<small>'+done+'/'+ids.length+' lokið</small></button>';}).join('')+'<button type="button" class="outline-item" id="showSummary">Skoða stöðu æfingarinnar →</button>';
 $('storageNote').textContent=storageText();
 root.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const ids=groupIndices(Number(b.dataset.group));state.cursor=ids.find(i=>!state.records[i].done)??ids[0];notice='';$('outlineDialog').close();render(true);});
 $('showSummary').onclick=()=>{state.cursor=questions.length;notice='';$('outlineDialog').close();render(true);};
 $('outlineDialog').showModal();
};
$('closeDialog').onclick=()=>$('outlineDialog').close();
$('outlineDialog').addEventListener('click',e=>{if(e.target===$('outlineDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
render();

})();
</script>
