<script>
(function(){'use strict';

const VERSION=1,KEY='ggj-lota16-timi03-aefing-v1';
const GROUPS=['Stæður utan sviga','Fleiri margfeldi','Samokareglan','Röð og formerki','Tugabrot og brot'];
const fmt=n=>String(Math.round(n*1e10)/1e10).replace('.',',').replace(/-/g,'−');
const v=s=>'<i>'+s+'</i>';
const pow=s=>v(s)+'<sup>2</sup>';
function poly(terms){let out='';for(const [n,s] of terms){if(!n)continue;let a=Math.abs(n),body=(a===1&&s?'':fmt(a))+s;out+=(out?(n<0?' − ':' + '):(n<0?'−':''))+body;}return out||'0';}
const PX=(a,b,c=0)=>poly([[a,pow('x')],[b,v('x')],[c,'']]);
const LX=(a,b)=>poly([[a,v('x')],[b,'']]);
const frac=(a,b)=>'<span class="fraction"><span>'+a+'</span><span>'+b+'</span></span>';
const eqs=(start,...lines)=>'<div class="math-steps"><div>'+start+'</div>'+lines.map(s=>'<div>= '+s+'</div>').join('')+'</div>';
function build(seed=0){
 const p=seed%2===0?
 {add:[3,5,2],subtract:[4,7,2],multi:[3,2,4],ym:[4,3,2,5],basic:5,scale:[3,4],two:[3,4],reverse:[2,9],reverse2:[3,8],decimal:0.3,decimal2:0.4,fraction:[2,3]}:
 {add:[4,6,3],subtract:[5,6,4],multi:[2,3,5],ym:[5,2,3,4],basic:6,scale:[4,5],two:[4,2],reverse:[4,7],reverse2:[2,9],decimal:0.2,decimal2:0.6,fraction:[3,5]};
 const qs=[];
 const mc=(group,title,intro,board,options,hints,explain,wrong)=>{
  const offset=(qs.length+seed)%options.length;
  const rotated=options.map((html,i)=>({html,correct:i===0}));
  for(let k=0;k<offset;k++)rotated.push(rotated.shift());
  qs.push({group,title,intro,board,type:'choice',options:rotated.map(o=>o.html),correct:rotated.findIndex(o=>o.correct),hints,explain,wrong});
 };
 const num=(group,title,intro,board,answer,label,hints,explain)=>
  qs.push({group,title,intro,board,type:'number',answer,label,unit:'',hints,explain});
 const P=(a,b,c,letter='x')=>poly([[a,pow(letter)],[b,v(letter)],[c,'']]);
 const L=(a,b,letter='x')=>poly([[a,v(letter)],[b,'']]);
 const bracket=s=>'('+s+')';
 const product=(a,b,c,d,letter='x')=>bracket(L(a,b,letter))+bracket(L(c,d,letter));
 const square=s=>bracket(s)+'<sup>2</sup>';
 const double=(a,b,c,left='x',right='y')=>poly([[a,pow(left)],[b,v(left)+v(right)],[c,pow(right)]]);
 let a,b,c,d,board,mid,expanded,answer;
 [a,b,c]=p.add;board=fmt(a)+v('x')+' + '+product(1,b,1,-c);mid=a+b-c;
 mc(0,'Liðurinn utan sviga','Margfaldaðu stæðurnar í svigunum og dragðu síðan saman alla líka liði.',board,
  [P(1,mid,-b*c),P(1,b-c,-b*c),P(a,a*(b-c),-a*b*c),P(1,mid,b*c)],
  ['Reiknaðu fyrst margfeldi stæðnanna í svigunum. Liðurinn utan sviga bætist svo við.',
   'Úr svigunum fæst '+P(1,b-c,-b*c)+'. Nú á eftir að bæta við '+fmt(a)+v('x')+'.'],
  eqs(board,fmt(a)+v('x')+' + '+P(1,b-c,-b*c),P(1,mid,-b*c)),
  'Plúsmerkið fyrir framan margfeldið þýðir að liðurinn utan sviga bætist við. Hann margfaldast ekki inn í svigana.');
 [a,b,c]=p.subtract;board=fmt(a)+pow('a')+' − '+product(1,b,1,-c,'a');
 expanded=P(1,b-c,-b*c,'a');
 mc(0,'Mínus fyrir framan margfeldi','Margfaldaðu tvíliðurnar. Veldu rétt milliskref. Mínusmerkið á enn að vera fyrir framan svigann.',board,
  [fmt(a)+pow('a')+' − '+bracket(expanded),fmt(a)+pow('a')+' − '+bracket(P(1,b-c,b*c,'a')),fmt(a)+pow('a')+' − '+bracket(P(1,b+c,-b*c,'a')),fmt(a)+pow('a')+' + '+bracket(expanded)],
  ['Mínusmerkið fyrir framan margfeldið á við alla niðurstöðuna.',

  eqs(board,fmt(a)+pow('a')+' − '+bracket(expanded))+'<p>Næst þarf að skipta um formerki allra liðanna í síðari sviganum.</p>',
  'Margfaldaðu tvíliðurnar fyrst og haltu mínusmerkinu fyrir framan alla niðurstöðuna.');
 answer=c-b;
 num(0,'Skiptu um öll formerkin','Haltu áfram með sömu stæðu. Hver er stuðullinn k?',
  board+' = '+fmt(a-1)+pow('a')+' + '+v('k')+v('a')+' + '+fmt(b*c),answer,'k =',
  ['Þegar þú tekur burt sviga með mínusmerki fyrir framan breytist formerki hvers liðar innan hans.',
   'Þegar sviginn er tekinn burt fæst '+fmt(a)+pow('a')+' − '+pow('a')+' − '+fmt(b-c)+v('a')+' + '+fmt(b*c)+'.'],
  eqs(board,fmt(a)+pow('a')+' − '+bracket(expanded),poly([[a,pow('a')],[-1,pow('a')],[c-b,v('a')],[b*c,'']]),P(a-1,c-b,b*c,'a'))+'<p>'+v('k')+' = '+fmt(answer)+'.</p>');

 [a,b,c]=p.multi;
 board=bracket(poly([[a,v('x')],[-1,v('y')]]))+bracket(poly([[1,v('x')],[-b,v('y')]]))+' + '+fmt(c)+v('x')+bracket(poly([[1,v('x')],[-1,v('y')]]));
 mid=-a*b-1-c;
 mc(1,'Tvö margfeldi leggjast saman','Reiknaðu bæði margfeldin og dragðu síðan saman líka liði.',board,
  [double(a+c,mid,b),double(a, -a*b-1,b),double(a+c,-a*b-1+c,b),double(a+c,mid,-b)],
  ['Ljúktu við hvort margfeldi fyrir sig. Safnaðu síðan x²-liðum, xy-liðum og y²-liðum.',
   'Fyrra margfeldið gefur '+double(a,-a*b-1,b)+'. Það síðara gefur '+double(c,-c,0)+'.'],
  eqs(board,double(a,-a*b-1,b)+' + '+bracket(double(c,-c,0)),double(a+c,mid,b)),
  'Margfaldaðu líka inn í síðari svigann. Dragðu xy-liði aðeins saman við aðra xy-liði.');
 [a,b,c,d]=p.ym;
 board=fmt(a)+v('y')+bracket(L(1,-b,'y'))+' − '+product(1,c,1,d,'y');
 answer=-a*b-c-d;
 num(1,'Stuðullinn eftir frádrátt','Finndu stuðulinn k eftir að hafa dreift og tekið svigana burt.',
  board+' = '+fmt(a-1)+pow('y')+' + '+v('k')+v('y')+' − '+fmt(c*d),answer,'k =',
  ['Reiknaðu bæði margfeldin og mundu að draga allt síðara margfeldið frá.',

  eqs(board,P(a,-a*b,0,'y')+' − '+bracket(P(1,c+d,c*d,'y')),P(a-1,answer,-c*d,'y'))+'<p>'+v('k')+' = '+fmt(answer)+'.</p>');
 mc(1,'Öll stæðan einfölduð','Veldu stæðuna þar sem allir líkir liðir hafa verið dregnir saman.',board,
  [P(a-1,answer,-c*d,'y'),P(a-1,-a*b+c+d,c*d,'y'),P(a+1,answer,-c*d,'y'),P(a-1,answer,c*d,'y')],
  ['Dragðu saman y²-liðina og y-liðina sitt í hvoru lagi. Fastaliðurinn heldur mínusmerkinu.',
   fmt(a)+pow('y')+' − '+pow('y')+' = '+fmt(a-1)+pow('y')+'. Mínusinn fyrir framan síðara margfeldið gerir fastaliðinn '+fmt(-c*d)+'.'],
  eqs(board,P(a,-a*b,0,'y')+' − '+bracket(P(1,c+d,c*d,'y')),P(a-1,answer,-c*d,'y')),
  'Mínusmerkið fyrir framan síðara margfeldið breytir formerki allra liðanna, líka fastaliðarins.');

 a=p.basic;board=product(1,a,1,-a);
 mc(2,'Samokareglan','Sömu liðir eru í báðum svigum, en annað merkið er plús og hitt mínus. Margfaldaðu.',board,
  [P(1,0,-a*a),P(1,0,a*a),P(1,2*a,a*a),P(1,0,-a)],
  ['Samokareglan er (A + B)(A − B) = A² − B².',
   'Hér er A = x og B = '+fmt(a)+'. Miðliðirnir '+fmt(-a)+v('x')+' og '+fmt(a)+v('x')+' eyðast.'],
  eqs(board,poly([[1,pow('x')],[-a,v('x')],[a,v('x')],[-a*a,'']]),P(1,0,-a*a)),
  'Notaðu samokaregluna: A² − B². Miðliðirnir hafa summuna núll.');
 [a,b]=p.scale;board=product(a,b,a,-b,'a');answer=a*a;
 num(2,'Allur liðurinn í annað veldi','Notaðu samokaregluna. Hvaða stuðull k stendur við a²?',
  board+' = '+v('k')+pow('a')+' − '+fmt(b*b),answer,'k =',
  ['Bæði talan og bókstafurinn í fyrri liðnum fara í annað veldi.',
   square(fmt(a)+v('a'))+' = '+fmt(a)+' · '+fmt(a)+' · '+v('a')+' · '+v('a')+'.'],
  eqs(board,square(fmt(a)+v('a'))+' − '+fmt(b)+'<sup>2</sup>',P(a*a,0,-b*b,'a'))+'<p>'+v('k')+' = '+fmt(answer)+'.</p>');
 [a,b]=p.two;
 board=bracket(poly([[a,v('y')],[b,v('z')]]))+bracket(poly([[a,v('y')],[-b,v('z')]]));
 mc(2,'Tveir bókstafir í samokum','Notaðu samokaregluna og settu báða liðina í annað veldi.',board,
  [double(a*a,0,-b*b,'y','z'),double(a,0,-b,'y','z'),double(a*a,0,b*b,'y','z'),double(a*a,2*a*b,b*b,'y','z')],
  ['Reglan gildir líka þegar báðir liðir hafa bókstafi.',
   'Reiknaðu '+square(fmt(a)+v('y'))+' og '+square(fmt(b)+v('z'))+' og dragðu síðara veldið frá því fyrra.'],
  eqs(board,square(fmt(a)+v('y'))+' − '+square(fmt(b)+v('z')),double(a*a,0,-b*b,'y','z')),
  'Settu bæði stuðlana og bókstafina í annað veldi. Hafðu mínusmerki á milli liðanna.');

 [a,b]=p.reverse;
 board=bracket(poly([[b,''],[a,v('y')]]))+bracket(L(a,-b,'y'));
 mc(3,'Raðaðu til að sjá samokana','Röð liðanna má breytast í samlagningu. Einfaldaðu stæðuna.',board,
  [P(a*a,0,-b*b,'y'),P(-a*a,0,b*b,'y'),P(a*a,0,b*b,'y'),P(a,0,-b*b,'y')],
  ['Skrifaðu fyrri svigann sem '+bracket(L(a,b,'y'))+'. Þá sést samokareglan.',
   'Liðurinn '+fmt(a)+v('y')+' hefur plúsmerki í báðum svigum. Talan '+fmt(b)+' kemur einu sinni með plús og einu sinni með mínus.'],
  eqs(board,product(a,b,a,-b,'y'),square(fmt(a)+v('y'))+' − '+fmt(b)+'<sup>2</sup>',P(a*a,0,-b*b,'y')),
  'Finndu liðinn sem hefur plúsmerki í báðum svigum. Ferningur hans kemur á undan mínusmerkinu.');
 [a,b]=p.reverse2;
 board=bracket(poly([[b,''],[-a,v('x')]]))+bracket(L(a,b));
 mc(3,'Hvor ferningurinn kemur á undan mínusnum?','Notaðu samokaregluna. Athugaðu vel hvor liðurinn hefur mínusmerki.',board,
  [poly([[b*b,''],[-a*a,pow('x')]]),P(a*a,0,-b*b),P(a*a,0,b*b),poly([[b*b,''],[-a,pow('x')]])],
  ['Skrifaðu síðari svigann sem '+bracket(poly([[b,''],[a,v('x')]]))+'.',
   'Hér er '+fmt(b)+' jákvætt í báðum svigum. Liðurinn '+fmt(a)+v('x')+' kemur með plús og mínus.'],
  eqs(board,bracket(poly([[b,''],[-a,v('x')]]))+bracket(poly([[b,''],[a,v('x')]])),fmt(b)+'<sup>2</sup> − '+square(fmt(a)+v('x')),poly([[b*b,''],[-a*a,pow('x')]])),
  'Hér er fastatalan jákvæð í báðum svigum. Því fæst ferningur tölunnar mínus ferningur bókstafsliðarins.');

 a=p.decimal;board=product(1,a,1,-a);answer=Math.round(a*a*10000)/10000;
 num(4,'Tugabrot í annað veldi','Finndu töluna k með samokareglunni.',
  board+' = '+pow('x')+' − '+v('k'),answer,'k =',
  ['Fastaliðurinn í samokareglunni kemur úr því að margfalda tugabrotið með sjálfu sér.',
   'Reiknaðu '+fmt(a)+' · '+fmt(a)+'. Þú átt að skrá jákvæða töluna k; mínusmerkið er þegar í jöfnunni.'],
  eqs(board,pow('x')+' − '+fmt(a)+'<sup>2</sup>',P(1,0,-answer))+'<p>'+v('k')+' = '+fmt(answer)+'.</p>');
 a=p.decimal2;board=product(1,a,1,-a,'b');answer=Math.round(a*a*10000)/10000;
 mc(4,'Samokar með tugabroti','Margfaldaðu og einfaldaðu.',board,
  [P(1,0,-answer,'b'),P(1,0,answer,'b'),P(1,0,-a,'b'),P(1,2*a,answer,'b')],
  ['Notaðu b² mínus ferning tugabrotsins.',
   fmt(a)+'<sup>2</sup> merkir '+fmt(a)+' · '+fmt(a)+', ekki '+fmt(a)+' · 2.'],
  eqs(board,pow('b')+' − '+fmt(a)+'<sup>2</sup>',P(1,0,-answer,'b')),
  'Mínusinn helst, og tugabrotið þarf að fara í annað veldi.');
 [a,b]=p.fraction;const f=frac(a,b),f2=frac(a*a,b*b);
 board='('+v('a')+' + '+f+')('+v('a')+' − '+f+')';
 mc(4,'Samokar með almennu broti','Notaðu samokaregluna. Láttu svarið vera með almennu broti.',board,
  [pow('a')+' − '+f2,pow('a')+' + '+f2,pow('a')+' − '+frac(a*a,b),pow('a')+' − '+f],
  ['Þegar brot fer í annað veldi fara bæði teljari og nefnari í annað veldi.',
   square(f)+' = '+frac(fmt(a)+' · '+fmt(a),fmt(b)+' · '+fmt(b))+'. Dragðu þetta brot frá a².'],
  eqs(board,pow('a')+' − '+square(f),pow('a')+' − '+f2),
  'Settu bæði teljara og nefnara í annað veldi. Samokareglan gefur frádrátt.');
 return {questions:qs,parameters:p};
}
function parseNumber(value){
 const clean=String(value).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/,/g,'.');
 const pattern=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/;
 if(!clean)return null;
 const bits=clean.split('/');
 if(bits.length>2||!bits.every(b=>pattern.test(b)))return null;
 const nums=bits.map(Number);
 if(nums.some(n=>!Number.isFinite(n))||(bits.length===2&&nums[1]===0))return null;
 return bits.length===2?nums[0]/nums[1]:nums[0];
}
function isCorrect(q,record){
 if(q.type==='choice')return record.choice===q.correct;
 const n=parseNumber(record.answer);return n!==null&&Math.abs(n-q.answer)<1e-9;
}
const cleanRecord=()=>({choice:null,answer:'',done:false,hints:0,attempts:0});
const cleanState=(seed=0)=>({version:VERSION,seed:seed%2,cursor:0,records:build(seed).questions.map(cleanRecord)});
function validState(s){
 const integer=(x,a,b)=>Number.isSafeInteger(x)&&x>=a&&x<=b;
 if(!s||s.version!==VERSION||!integer(s.seed,0,1))return false;
 const qs=build(s.seed).questions;
 if(!integer(s.cursor,0,qs.length)||!Array.isArray(s.records)||s.records.length!==qs.length)return false;
 return s.records.every((r,i)=>r&&typeof r==='object'&&(r.choice===null||integer(r.choice,0,(qs[i].options?.length??0)-1))&&typeof r.answer==='string'&&r.answer.length<=80&&typeof r.done==='boolean'&&integer(r.hints,0,qs[i].hints.length)&&integer(r.attempts,0,1000000)&&(!r.done||isCorrect(qs[i],r)));
}

const root=document.getElementById('ggj-lota16-timi3');
const $=id=>root.querySelector('#'+id);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageWorks=true,state,notice='';
let stored=null;
try{stored=localStorage.getItem(KEY);}catch{storageWorks=false;}
try{state=JSON.parse(stored);if(!validState(state))state=cleanState();}
catch{state=cleanState();}
let questions=build(state.seed).questions;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageWorks=false;}}
const storageText=()=>storageWorks?'Framvindan geymist í þessum vafra. Svör eru ekki send til kennara.':'Vafrinn leyfir ekki vistun. Framvindan helst meðan æfingin er opin.';
function groupIndices(g){return questions.map((q,i)=>q.group===g?i:-1).filter(i=>i>=0);}
function progress(){
 const total=state.records.filter(r=>r.done).length;
 const current=questions[state.cursor]?.group;
 $('progress').innerHTML=GROUPS.map((_,g)=>{const ids=groupIndices(g),done=ids.every(i=>state.records[i].done);return '<i class="'+(done?'done ':'')+(current===g?'current':'')+'"></i>';}).join('');
 $('progress').setAttribute('aria-valuenow',String(total));
 $('progress').setAttribute('aria-valuemax',String(questions.length));
 $('progress').setAttribute('aria-valuetext',total+' af '+questions.length+' spurningum lokið');
}
function feedback(q,r){
 $('feedback').innerHTML=r.done?'<div class="feedback success"><strong>Rétt hjá þér</strong>'+q.explain+'</div>':notice?'<div class="feedback"><strong>Skoðum þetta aðeins</strong>'+notice+'</div>':'';
 $('hints').innerHTML=r.hints?'<div class="hint-box"><strong>Vísbending'+(r.hints>1?'ar':'')+'</strong>'+q.hints.slice(0,r.hints).map(h=>'<p>'+h+'</p>').join('')+'</div>':'';
}
function render(focus=false){
 save();progress();
 if(state.cursor===questions.length){summary(focus);return;}
 const q=questions[state.cursor],r=state.records[state.cursor];
 $('stepcount').textContent='Hluti '+(q.group+1)+' af '+GROUPS.length;
 $('subcount').textContent='Spurning '+(state.cursor+1)+' af '+questions.length;
 const isFigure=q.board.startsWith('<svg'),isWords=q.board.startsWith('<div');
 let inputs='';
 if(q.type==='choice'){
 inputs='<div class="choices" role="group" aria-label="Svarmöguleikar">'+q.options.map((o,i)=>'<button type="button" class="choice '+(r.choice===i?'selected ':'')+(r.done&&r.choice===i?'correct':'')+'" data-choice="'+i+'" aria-pressed="'+(r.choice===i)+'" '+(r.done?'disabled':'')+'><span class="letter" aria-hidden="true">'+String.fromCharCode(65+i)+'</span><span class="math">'+o+'</span></button>').join('')+'</div>';
 }else{
 inputs='<div class="answer-field"><label for="answer">'+escape(q.label)+(q.unit?' ('+escape(q.unit)+')':'')+'</label><div class="input-row"><input id="answer" type="text" inputmode="text" maxlength="80" autocomplete="off" aria-describedby="input-help" value="'+escape(r.answer)+'" '+(r.done?'disabled':'')+'><span class="unit">'+escape(q.unit)+'</span></div><p id="input-help" class="input-help">Skrifaðu tölu eða almennt brot, til dæmis −1,5 eða −3/2. Þú mátt nota kommu eða punkt í tugabroti.</p></div>';
 }
 $('exercise').innerHTML='<div class="eyebrow">'+GROUPS[q.group]+'</div><h1 id="heading" tabindex="-1">'+q.title+'</h1><p class="intro">'+q.intro+'</p><div class="board '+(isFigure?'figure-board':'algebra-board')+'">'+(isFigure||isWords?q.board:'<div class="equation">'+q.board+'</div>')+'</div>'+inputs;
 $('back').disabled=state.cursor===0;
 $('hint').hidden=false;$('hint').disabled=r.done||r.hints>=q.hints.length;
 $('check').hidden=false;$('check').textContent=r.done?(state.cursor===questions.length-1?'Skoða yfirlit →':'Áfram →'):'Athuga svar →';
 feedback(q,r);
 root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{
  if(r.done)return;
  r.choice=Number(b.dataset.choice);notice='';render();
  root.querySelector('[data-choice="'+r.choice+'"]')?.focus({preventScroll:true});
 });
 if($('answer')){
  $('answer').oninput=e=>{r.answer=e.target.value;notice='';$('feedback').innerHTML='';save();};
  $('answer').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};
 }
 if(focus)$('heading').focus({preventScroll:true});
}
function check(){
 if(state.cursor===questions.length)return;
 const q=questions[state.cursor],r=state.records[state.cursor];
 if(r.done){state.cursor++;notice='';render(true);return;}
 if(q.type==='choice'&&r.choice===null){notice='Veldu svarmöguleika fyrst.';feedback(q,r);return;}
 if(q.type==='number'&&parseNumber(r.answer)===null){notice='Skráðu tölu eða almennt brot í svarreitinn. Ef þú notar brot má nefnarinn ekki vera núll.';feedback(q,r);$('answer').focus();return;}
 r.attempts++;r.done=isCorrect(q,r);
 notice=r.done?'':q.wrong||'Skoðaðu útreikningana aftur. Vísbendingin getur hjálpað þér að finna næsta skref.';
 render();
 if(r.done)$('check').focus({preventScroll:true});
 else if(q.type==='number'){$('answer').focus({preventScroll:true});$('answer').select();}
}
function summary(focus=false){
 const total=state.records.filter(r=>r.done).length,complete=total===questions.length;
 $('stepcount').textContent='Yfirlit';$('subcount').textContent=total+' af '+questions.length+' lokið';
 $('hint').hidden=true;$('check').hidden=true;$('back').disabled=false;
 $('feedback').innerHTML='';$('hints').innerHTML='';
 $('exercise').innerHTML='<div class="summary"><div class="seal" aria-hidden="true">'+(complete?'✓':'↗')+'</div><div class="eyebrow">Lota 16 · 3. tími</div><h1 id="heading" tabindex="-1">'+(complete?'Vel gert. Æfingunni er lokið.':'Haltu áfram með æfinguna.')+'</h1><p class="intro">'+(complete?'Þú hefur einfaldað stæður með mörgum margfeldum, tekið mínus inn í sviga og notað samokaregluna með heiltölum, tugabrotum og almennum brotum.':'Þú hefur lokið '+total+' spurningum. Veldu hluta í yfirlitinu eða haltu áfram með næstu spurningu sem þú átt eftir.')+'</p><ul class="summary-list">'+GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<li class="'+(done===ids.length?'finished':'unfinished')+'">'+name+' <span>'+done+'/'+ids.length+'</span></li>';}).join('')+'</ul><button type="button" class="primary" id="again">'+(complete?'Æfa aftur með nýjum tölum':'Halda áfram')+' →</button><p class="storage-note">'+storageText()+'</p></div>';
 $('again').onclick=()=>{
  if(complete){state=cleanState((state.seed+1)%2);questions=build(state.seed).questions;}
  else state.cursor=state.records.findIndex(r=>!r.done);
  notice='';render(true);
 };
 if(focus)$('heading').focus({preventScroll:true});
}
$('check').onclick=check;
$('hint').onclick=()=>{if(state.cursor>=questions.length)return;const r=state.records[state.cursor],q=questions[state.cursor];if(!r.done){r.hints=Math.min(r.hints+1,q.hints.length);save();feedback(q,r);$('hint').disabled=r.hints>=q.hints.length;}};
$('back').onclick=()=>{if(state.cursor>0){state.cursor--;notice='';render(true);}};
$('outline').onclick=()=>{
 $('outlineItems').innerHTML=GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<button type="button" class="outline-item" data-group="'+g+'"><span>'+String(g+1).padStart(2,'0')+'</span>'+name+'<small>'+done+'/'+ids.length+' lokið</small></button>';}).join('')+'<button type="button" class="outline-item" id="showSummary">Skoða stöðu æfingarinnar →</button>';
 $('storageNote').textContent=storageText();
 root.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const ids=groupIndices(Number(b.dataset.group));state.cursor=ids.find(i=>!state.records[i].done)??ids[0];notice='';$('outlineDialog').close();render(true);});
 $('showSummary').onclick=()=>{state.cursor=questions.length;notice='';$('outlineDialog').close();render(true);};
 $('outlineDialog').showModal();
};
$('closeDialog').onclick=()=>$('outlineDialog').close();
$('outlineDialog').addEventListener('click',e=>{if(e.target===$('outlineDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
render();

})();
</script>
