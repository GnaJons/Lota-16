<script>
(function(){'use strict';

const VERSION=1,KEY='ggj-lota16-timi01-aefing-v1';
const GROUPS=['Dreifa og draga saman','Setja inn gildi','Ummál og flatarmál','Tugabrot og svigar','Sameiginlegur þáttur','Orð verða að reikningi'];
const fmt=n=>String(Math.round(n*1e10)/1e10).replace('.',',').replace(/-/g,'−');
const v=s=>'<i>'+s+'</i>';
const pow=s=>v(s)+'<sup>2</sup>';
function poly(terms){let out='';for(const [n,s] of terms){if(!n)continue;let a=Math.abs(n),body=(a===1&&s?'':fmt(a))+s;out+=(out?(n<0?' − ':' + '):(n<0?'−':''))+body;}return out||'0';}
const PX=(a,b,c=0)=>poly([[a,pow('x')],[b,v('x')],[c,'']]);
const LX=(a,b)=>poly([[a,v('x')],[b,'']]);
const frac=(a,b)=>'<span class="fraction"><span>'+a+'</span><span>'+b+'</span></span>';
const eqs=(start,...lines)=>'<div class="math-steps"><div>'+start+'</div>'+lines.map(s=>'<div>= '+s+'</div>').join('')+'</div>';
function rectangle(a,b,c){return '<svg viewBox="0 0 480 220" role="img" aria-labelledby="rect-title"><title id="rect-title">Rétthyrningur: lengd '+a+'x + '+b+' og breidd x + '+c+' sentimetrar. Skissa, ekki í kvarða.</title><rect x="65" y="55" width="280" height="105" rx="1" fill="#eaf3f8" stroke="#425963" stroke-width="2"/><path d="M65 145h15v15" fill="none" stroke="#ac572e" stroke-width="2"/><text x="205" y="33" text-anchor="middle" class="figure-label">'+a+'x + '+b+'</text><text x="365" y="112" class="figure-label">x + '+c+'</text><text x="205" y="195" text-anchor="middle" class="svg-note">Lengdir í cm · skissa, ekki í kvarða</text></svg>';}
function build(seed=0){
 const z=seed%2;
 const p=z?{base:13,m:2,n:4,k:5,A:4,B:3,C:5,p:3,q:5,ia:3,ib:4,ic:2,x:-3,fa:3,fb:8,fd:3,ra:2,rb:3,rc:2,rx:5,d1:.3,d2:.7,du:4,dv:3,dw:2,g:6,ga:5,aa:4,ab:7,add:5,mult:2,total:26,gap:8,discount:20,remaining:64}
 :{base:11,m:3,n:2,k:4,A:3,B:2,C:4,p:2,q:3,ia:2,ib:3,ic:4,x:-2,fa:2,fb:7,fd:2,ra:3,rb:2,rc:1,rx:4,d1:.4,d2:.6,du:5,dv:2,dw:3,g:5,ga:6,aa:2,ab:5,add:4,mult:3,total:27,gap:7,discount:25,remaining:54};
 const qs=[];
 const mc=(group,title,intro,board,options,hints,explain,wrong)=>{const offset=(qs.length+seed)%options.length;const rotated=options.map((html,i)=>({html,correct:i===0}));for(let k=0;k<offset;k++)rotated.push(rotated.shift());qs.push({group,title,intro,board,type:'choice',options:rotated.map(o=>o.html),correct:rotated.findIndex(o=>o.correct),hints,explain,wrong});};
 const num=(group,title,intro,board,answer,label,unit,hints,explain)=>qs.push({group,title,intro,board,type:'number',answer,label,unit,hints,explain});
 const x=v('x'),y=v('y'),a=v('a'),m=v('m');
 let start=p.base+' − '+p.m+'('+p.n+' − '+p.k+x+')';
 mc(0,'Neikvæður stuðull fyrir sviga','Hvaða stæða fæst þegar þú margfaldar inn í svigann og dregur saman líka liði?',start,
 [p.base+' − '+p.m*p.n+' + '+p.m*p.k+x,p.base+' − '+p.m*p.n+' − '+p.m*p.k+x,p.base+' − '+p.m*p.n+' + '+p.k+x,p.base+' + '+p.m*p.n+' − '+p.m*p.k+x],
 ['Margfaldaðu −'+p.m+' með báðum liðum svigans.','Mínus sinnum mínus verður plús: (−'+p.m+') × (−'+p.k+x+') = '+p.m*p.k+x+'.'],

function parseNumber(value){
 const clean=String(value).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/,/g,'.');
 const pattern=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/;
 if(!clean)return null;
 const bits=clean.split('/');
 if(bits.length>2||!bits.every(b=>pattern.test(b)))return null;
 const nums=bits.map(Number);
 if(nums.some(n=>!Number.isFinite(n))||(bits.length===2&&nums[1]===0))return null;
 return bits.length===2?nums[0]/nums[1]:nums[0];
}
function isCorrect(q,record){
 if(q.type==='choice')return record.choice===q.correct;
 const n=parseNumber(record.answer);return n!==null&&Math.abs(n-q.answer)<1e-9;
}
const cleanRecord=()=>({choice:null,answer:'',done:false,hints:0,attempts:0});

 if(!s||s.version!==VERSION||!integer(s.seed,0,1))return false;
 const qs=build(s.seed).questions;

}

}
function summary(focus=false){
 const total=state.records.filter(r=>r.done).length,complete=total===questions.length;
 $('stepcount').textContent='Yfirlit';$('subcount').textContent=total+' af '+questions.length+' lokið';
 $('hint').hidden=true;$('check').hidden=true;$('back').disabled=false;
 $('feedback').innerHTML='';$('hints').innerHTML='';
 $('exercise').innerHTML='<div class="summary"><div class="seal" aria-hidden="true">'+(complete?'✓':'↗')+'</div><div class="eyebrow">Lota 16 · 1. tími</div><h1 id="heading" tabindex="-1">'+(complete?'Vel gert. Æfingunni er lokið.':'Haltu áfram með æfinguna.')+'</h1><p class="intro">'+(complete?'Þú hefur margfaldað inn í sviga, dregið saman líka liði, sett inn gildi og tengt stæður við myndir og orð.':'Þú hefur lokið '+total+' spurningum. Veldu hluta í yfirlitinu eða haltu áfram með næstu spurningu sem þú átt eftir.')+'</p><ul class="summary-list">'+GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<li class="'+(done===ids.length?'finished':'unfinished')+'">'+name+' <span>'+done+'/'+ids.length+'</span></li>';}).join('')+'</ul><button type="button" class="primary" id="again">'+(complete?'Æfa aftur með nýjum tölum':'Halda áfram')+' →</button><p class="storage-note">'+storageText()+'</p></div>';
 $('again').onclick=()=>{
  if(complete){state=cleanState((state.seed+1)%2);questions=build(state.seed).questions;}
  else state.cursor=state.records.findIndex(r=>!r.done);
  notice='';render(true);
 };
 if(focus)$('heading').focus({preventScroll:true});
}
$('check').onclick=check;
$('hint').onclick=()=>{if(state.cursor>=questions.length)return;const r=state.records[state.cursor],q=questions[state.cursor];if(!r.done){r.hints=Math.min(r.hints+1,q.hints.length);save();feedback(q,r);$('hint').disabled=r.hints>=q.hints.length;}};
$('back').onclick=()=>{if(state.cursor>0){state.cursor--;notice='';render(true);}};
$('outline').onclick=()=>{
 $('outlineItems').innerHTML=GROUPS.map((name,g)=>{const ids=groupIndices(g),done=ids.filter(i=>state.records[i].done).length;return '<button type="button" class="outline-item" data-group="'+g+'"><span>'+String(g+1).padStart(2,'0')+'</span>'+name+'<small>'+done+'/'+ids.length+' lokið</small></button>';}).join('')+'<button type="button" class="outline-item" id="showSummary">Skoða stöðu æfingarinnar →</button>';
 $('storageNote').textContent=storageText();
 root.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const ids=groupIndices(Number(b.dataset.group));state.cursor=ids.find(i=>!state.records[i].done)??ids[0];notice='';$('outlineDialog').close();render(true);});
 $('showSummary').onclick=()=>{state.cursor=questions.length;notice='';$('outlineDialog').close();render(true);};
 $('outlineDialog').showModal();
};
$('closeDialog').onclick=()=>$('outlineDialog').close();
$('outlineDialog').addEventListener('click',e=>{if(e.target===$('outlineDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
render();

})();
</script>
<script src="child.js" defer></script>
</body></html>
